<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canopee Chat</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, sans-serif; background: #101418; color: #e6edf3;
      height: 100vh; display: flex; flex-direction: column;
    }
    header {
      padding: 10px 14px; background: #161b22; border-bottom: 1px solid #21262d;
      font-size: 13px; display: flex; flex-direction: column; gap: 6px;
    }
    header .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .my-id {
      font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #8b949e;
      background: #0d1117; border: 1px solid #21262d; border-radius: 5px;
      padding: 4px 8px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; user-select: all;
    }
    .meta { color: #8b949e; font-size: 11px; }
    button {
      background: #238636; color: #fff; border: 0; border-radius: 5px; padding: 5px 10px;
      cursor: pointer; font-size: 12px;
    }
    button:hover { filter: brightness(1.1); }
    button.secondary { background: #21262d; }
    main { flex: 1; display: flex; min-height: 0; }
    aside {
      width: 170px; border-right: 1px solid #21262d; background: #161b22;
      display: flex; flex-direction: column; overflow-y: auto;
    }
    aside h3 { margin: 10px 12px 4px; font-size: 11px; text-transform: uppercase; color: #8b949e; }
    #peer-form { padding: 8px; border-bottom: 1px solid #21262d; display: flex; flex-direction: column; gap: 6px; }
    input { background: #0d1117; border: 1px solid #30363d; border-radius: 5px; color: #e6edf3; padding: 6px 8px; font-size: 12px; width: 100%; }
    #peer-list { padding: 6px; display: flex; flex-direction: column; gap: 4px; }
    .peer { padding: 7px 9px; border-radius: 5px; cursor: pointer; font-size: 13px; }
    .peer:hover { background: #21262d; }
    .peer.active { background: #1f6feb; color: #fff; }
    #chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    #messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 4px; }
    .msg { max-width: 70%; padding: 7px 10px; border-radius: 9px; font-size: 13px; line-height: 1.35; word-wrap: break-word; }
    .msg.in { background: #21262d; align-self: flex-start; }
    .msg.out { background: #1f6feb; align-self: flex-end; }
    .msg .sender { font-size: 10px; color: #8b949e; margin-bottom: 2px; }
    #empty { color: #8b949e; font-size: 12px; text-align: center; margin-top: 40%; }
    #composer { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #21262d; }
    #composer input { flex: 1; }
    .error { color: #f85149; font-size: 12px; }
    #status { font-size: 11px; color: #8b949e; }
    #listen { font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: #8b949e; word-break: break-all; }
  </style>
</head>
<body>
  <header>
    <div class="row">
      <strong style="font-size:14px">Canopee Chat</strong>
      <span class="meta" id="status">starting…</span>
      <span style="flex:1"></span>
      <button id="copy-id" class="secondary" disabled>Copy my ID</button>
    </div>
    <div class="row">
      <span class="my-id" id="my-id" title="Your contact string — copy and send it to a contact">…</span>
    </div>
    <details>
      <summary style="font-size:11px;color:#8b949e;cursor:pointer">network details</summary>
      <div class="meta" id="listen"></div>
    </details>
  </header>

  <main>
    <aside>
      <h3>Add contact</h3>
      <div id="peer-form">
        <input id="name" placeholder="name (e.g. alice)" />
        <input id="contact" placeholder="their contact string (canopee://identity/…)" />
        <button id="add-peer">Add contact</button>
        <div class="error" id="peer-error"></div>
      </div>
      <h3>Contacts</h3>
      <div id="peer-list"></div>
    </aside>

    <section id="chat">
      <div id="messages">
        <div id="empty">Add a contact and exchange IDs to start chatting.<br/>Messages are end-to-end encrypted.</div>
      </div>
      <div id="composer">
        <input id="text" placeholder="Type a message (encrypted)" disabled />
        <button id="send" disabled>Send</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
