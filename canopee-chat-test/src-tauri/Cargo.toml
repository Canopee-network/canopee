[package]
name = "canopee-chat-test"
version = "0.1.0"
description = "Minimal Tauri desktop chat app with an embedded Canopee node"
edition = "2024"

[lib]
name = "canopee_chat_test_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
hex = "0.4"
rand = "0.8"
hkdf = "0.12"
sha2 = "0.10"
chacha20poly1305 = "0.10"

canopee-config = { path = "../../crates/canopee-config" }
canopee-identity = { path = "../../crates/canopee-identity" }
canopee-network = { path = "../../crates/canopee-network" }
canopee-runtime = { path = "../../crates/canopee-runtime" }
canopee-storage = { path = "../../crates/canopee-storage" }

[dev-dependencies]
tempfile = "3"
