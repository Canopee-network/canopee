[package]
name = "canopee-node"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
bincode = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

canopee-identity = { path = "../canopee-identity" }
canopee-storage = { path = "../canopee-storage" }
canopee-runtime = { path = "../canopee-runtime" }
canopee-protocol = { path = "../canopee-protocol" }
