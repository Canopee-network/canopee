[package]
name = "canopee-runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
bincode = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
time = { version = "0.3", features = ["serde"] }

canopee-identity = { path = "../canopee-identity" }
canopee-storage = { path = "../canopee-storage" }
canopee-config = { path = "../canopee-config" }
