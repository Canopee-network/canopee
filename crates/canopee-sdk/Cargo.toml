[package]
name = "canopee-sdk"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
bincode = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }

canopee-protocol = { path = "../canopee-protocol" }
canopee-config = { path = "../canopee-config" }
canopee-identity = { path = "../canopee-identity" }
canopee-storage = { path = "../canopee-storage" }

[dev-dependencies]
canopee-node = { path = "../canopee-node" }
