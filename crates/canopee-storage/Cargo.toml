[package]
name = "canopee-storage"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
bincode = "1"
sha2 = "0.10"
hex = "0.4"
libp2p = "0.54"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
time = { version = "0.3", features = ["serde"] }

canopee-identity = { path = "../canopee-identity" }
