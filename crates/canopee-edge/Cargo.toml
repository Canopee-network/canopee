[package]
name = "canopee-edge"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
async-trait = "0.1"
libp2p = { version = "0.54", features = ["cbor"] }
rustls = "0.23"
rustls-pemfile = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

canopee-network = { path = "../canopee-network" }
canopee-storage = { path = "../canopee-storage" }

[dev-dependencies]